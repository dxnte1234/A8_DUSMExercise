<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel CONEVAL 2008-2018</title>
<script src="https://www.gstatic.com/charts/loader.js"></script>

<script>
google.charts.load('current', {'packages':['corechart','bar']});
google.charts.setOnLoadCallback(drawCharts);

function drawCharts(){

// -------- GRAFICO 1 POBREZA --------
var data1 = google.visualization.arrayToDataTable([
['Año','Pobreza (%)'],
['2008',44.4],
['2010',46.1],
['2012',45.5],
['2014',46.2],
['2016',43.6],
['2018',41.9]
]);

var chart1 = new google.visualization.LineChart(document.getElementById('chart1'));
chart1.draw(data1, {title:'Evolución de la pobreza (%)'});


// -------- GRAFICO 2 POBREZA EXTREMA --------
var data2 = google.visualization.arrayToDataTable([
['Año','Pobreza Extrema (%)'],
['2008',11.0],
['2010',11.3],
['2012',9.8],
['2014',9.5],
['2016',7.6],
['2018',7.4]
]);

var chart2 = new google.visualization.LineChart(document.getElementById('chart2'));
chart2.draw(data2, {title:'Evolución de la pobreza extrema (%)'});


// -------- GRAFICO 3 CARENCIAS --------
var data3 = google.visualization.arrayToDataTable([
['Carencia','2008','2018'],
['Rezago educativo',21.9,16.9],
['Servicios de salud',38.4,16.2],
['Seguridad social',65.0,57.3],
['Calidad vivienda',17.7,11.1],
['Servicios básicos',22.9,19.8],
['Alimentación',21.7,20.4]
]);

var chart3 = new google.visualization.ColumnChart(document.getElementById('chart3'));
chart3.draw(data3, {title:'Carencias sociales 2008 vs 2018'});


// -------- GRAFICO 4 INGRESOS --------
var data4 = google.visualization.arrayToDataTable([
['Indicador','2008','2018'],
['Ingreso bajo línea pobreza extrema',16.8,16.8],
['Ingreso bajo línea pobreza',49.0,48.8]
]);

var chart4 = new google.charts.Bar(document.getElementById('chart4'));
chart4.draw(data4);


// -------- GRAFICO 5 BRECHA RURAL-URBANA --------
var data5 = google.visualization.arrayToDataTable([
['Zona','2008','2018'],
['Rural',62.5,55.3],
['Urbana',38.9,37.6]
]);

var chart5 = new google.visualization.ColumnChart(document.getElementById('chart5'));
chart5.draw(data5, {title:'Pobreza Rural vs Urbana'});
}
</script>
</head>

<body style="font-family: Arial;">
<h2>Panel de Pobreza en México 2008-2018</h2>

<div id="chart1" style="width:100%; height:400px;"></div>
<div id="chart2" style="width:100%; height:400px;"></div>
<div id="chart3" style="width:100%; height:400px;"></div>
<div id="chart4" style="width:100%; height:400px;"></div>
<div id="chart5" style="width:100%; height:400px;"></div>

</body>
</html>
